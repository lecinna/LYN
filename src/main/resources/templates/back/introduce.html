<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>个人介绍</title>
    <link rel="stylesheet" th:href="@{/local/css/backManage.css}">
    <link rel="stylesheet" th:href="@{/local/css/introduce.css}">
    <link rel="stylesheet" th:href="@{/local/css/page.css}">
</head>
<body>
<div id="manager"><h2>LYN系统后台管理</h2></div>
<div id="top" th:fragment="top">
    <input id="bthFresh" type="button" value="刷新">
    <form th:action="@{/admin/login}">
        <input id="logout" type="submit" value="退出登录">
    </form>
</div>
<div id="left" th:fragment="left">
    <div class="nav">
        <ul class="navCon">
            <li><a th:href="@{/loginBack/first}">首页</a></li>
            <li>
                <div class="dropdown">
                    <a th:href="@{#}" class="dropbtn">个人介绍</a>
                    <div class="dropdown-content">
                        <a th:href="@{#}" target="_parent" title="introduce">个人介绍</a>
                        <a th:href="@{/loginBack/back/perform}" target="_parent" title="performance">演艺经历</a>
                    </div>
                </div>
            </li>
            <li>
                <div class="dropdown">
                    <a th:href="@{/login/back/musicWork}" class="dropbtn">音乐作品</a>
                    <div class="dropdown-content">
                        <a th:href="@{/loginBack/back/ost}" target="_parent" title="ost">OST</a>
                        <a th:href="@{/loginBack/back/ep}" target="_parent" title="ep">专辑</a>
                        <a th:href="@{/loginBack/back/single}" target="_parent" title="single">单曲</a>
                    </div>
                </div>
            </li>
            <li><a th:href="@{/loginBack/back/action}">影视作品</a></li>
            <li><a th:href="@{/loginBack/back/word}">经典语录</a></li>
            <li>
                <div class="dropdown">
                    <a th:href="@{/loginBack/back/prize}" class="dropbtn">代言及奖项</a>
                    <div class="dropdown-content" >
                        <a th:href="@{/loginBack/back/endorsement}" target="_parent" title="endorsement">代言</a>
                        <a th:href="@{/loginBack/back/achievement}" target="_parent" title="achievement">奖项</a>
                    </div>
                </div>
            </li>
            <li><a th:href="@{/loginBack/back/concert}">演唱会</a></li>
            <li><a th:href="@{/loginBack/back/message}">评价管理</a></li>
            <li><a th:href="@{/loginBack/back/system}">系统管理</a></li>
        </ul>
    </div>
</div>
<div class="content-area">
<div id="incident" th:text="${incident}"></div>
    <div class="toolbar">
        <form th:action="@{/loginBack/back/toAddIntro}" method="get">
            <button type="submit" class="btn-add">
                <span>+添加事件</span>
            </button>
        </form>
    </div>
<table class="data-table">
    <thead>
    <tr>
        <th style="width: 80px;">时间</th>
        <th style="width: 300px;">事件</th>
        <th>图片</th>
        <th style="width: 200px;">操作</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item:${introducePage.list}" >
        <td th:text="${item.time}"></td>
        <td th:text="${item.incident}"></td>
        <td><img class="listimg"  style="width:50px;height:50px" th:src="@{${item.image}}"  alt="捐款图片"></td>
        <td><a th:href="@{'/loginBack/delIntro?incident='+${item.incident}}"
            onclick="return confirm('确定要删除该事件吗？')">删除</a>
        <a th:href="@{'/loginBack/back/toEditIntro?introId='+${item.introId}}">修改</a>
        </td>
    </tr>
    </tbody>
</table>
<div class="pagination-info">
    <div th:with="path='/loginBack/back/introduce?pageNum='" style="position: absolute;bottom: -100px;left: 400px; margin-top: 50px;">
        <div>
            当前是第<span th:text="${introducePage.pageNum}"></span>页
            共<span th:text="${introducePage.pages}"></span>页
            共<span th:text="${introducePage.total}"></span>条记录
        </div>
        <ul class="pagelist">
            <li>
                <a th:href="${path}+'1'">首页</a>
            </li>
            <li th:if="${introducePage.hasPreviousPage}">
                <a th:href="${path}+${introducePage.prePage}">上一页</a>
            </li>
            <li th:if="${introducePage.hasNextPage}">
                <a th:href="${path}+${introducePage.nextPage}">下一页</a>
            </li>
            <li th:if="${introducePage.pages > 1}">
                <a th:href="${path}+${introducePage.pages}">尾页</a>
            </li>
        </ul>
    </div>
</div>
</div>
<div id="bottom">底部</div>
</body>
</html>
