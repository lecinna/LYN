<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <style type="text/css">
        .content-area {
            margin-left: 180px;
            padding: 20px 30px;
            min-height: calc(100vh - 90px);
            width: 1360px;
            position: absolute;
            top: -60px;
            left: 50px;
        }
        .pagination-container {
            display: flex;
            position: relative;
            top: -280px;
            left:750px;
            justify-content: center;
            align-items: center;
            margin-top: 120px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(222, 184, 135, 0.15);
        }

        .pagination-info {
        color: #666;
        font-size: 14px;
        text-align: center;
        }

        .pagination-info span {
        color: #B8860B;
        font-weight: 600;
        margin: 0 3px;
        }

        .pagelist {
        display: flex;
        gap: 8px;
        list-style: none;
        margin: 15px 0 0 0;
        padding: 0;
        justify-content: center;
        }

        .pagelist li a {
        padding: 8px 14px;
        border: 1px solid #ddd;
        border-radius: 6px;
        text-decoration: none;
        color: #666;
        transition: all 0.3s ease;
        display: inline-block;
        }

        .pagelist li a:hover {
        color: white;
        border-color: #667eea;
        }
    </style>
    <meta charset="UTF-8">
    <title>单曲</title>
    <link rel="stylesheet" th:href="@{/local/css/backManage.css}">
    <link rel="stylesheet" th:href="@{/local/css/single.css}">
    <link rel="stylesheet" th:href="@{/local/css/page.css}">
</head>
<body>
<div id="manager"><h2>LYN系统后台管理</h2></div>
<div id="top" th:fragment="top">
    <input id="bthFresh" type="button" value="刷新">
    <form th:action="@{/admin/doLogin}">
        <input id="logout" type="submit" value="退出登录">
    </form>
</div>
<div id="left" th:fragment="left">
    <div class="nav">
        <ul class="navCon">
            <li><a th:href="@{/loginBack/first}">首页</a></li>
            <li>
                <div class="dropdown">
                    <a th:href="@{/loginBack/back/introduce}" class="dropbtn">个人介绍</a>
                    <div class="dropdown-content">
                        <a th:href="@{/loginBack/back/introduce}" target="_parent" title="introduce">个人介绍</a>
                        <a th:href="@{/loginBack/back/perform}" target="_parent" title="performance">演艺经历</a>
                    </div>
                </div>
            </li>
            <li>
                <div class="dropdown">
                    <a th:href="@{/login/back/music}" class="dropbtn">音乐作品</a>
                    <div class="dropdown-content">
                        <a th:href="@{/loginBack/back/ost}" target="_parent" title="ost">OST</a>
                        <a th:href="@{/loginBack/back/ep}" target="_parent" title="ep">专辑</a>
                        <a th:href="@{#}" target="_parent" title="single">单曲</a>
                    </div>
                </div>
            </li>
            <li><a th:href="@{/loginBack/back/action}">影视作品</a></li>
            <li><a th:href="@{/loginBack/back/word}">经典语录</a></li>
            <li>
                <div class="dropdown">
                    <a th:href="@{/loginBack/back/prize}" class="dropbtn">代言及奖项</a>
                    <div class="dropdown-content" >
                        <a th:href="@{/loginBack/back/endorsement}" target="_parent" title="endorsement">代言</a>
                        <a th:href="@{/loginBack/back/achievement}" target="_parent" title="achievement">奖项</a>
                    </div>
                </div>
            </li>
            <li><a th:href="@{/loginBack/back/message}">评价管理</a></li>
            <li><a th:href="@{/loginBack/back/system}">系统管理</a></li>
        </ul>
    </div>
</div>
<div id="singleId" th:text="${singleId}"></div>
<div class="content-area">
    <div class="toolbar">
        <form th:action="@{/loginBack/back/toAddSingle}" method="get">
            <button type="submit" class="btn-add">
                <span>+添加单曲</span>
            </button>
        </form>
    </div>
    <table class="data-table">
        <thead>
        <tr>
            <th>序号</th>
            <th>单曲名称</th>
            <th>日期</th>
            <th>单曲音乐</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="item : ${singlePage.list}">
            <td th:text="${item.singleId}"></td>
            <td th:text="${item.name}"></td>
            <td th:text="${item.music}"></td>
            <td>
                <a th:href="@{'/loginBack/delsingle?singleId='+${item.singleId}}"
                   onclick="return confirm('确定要删除该条记录吗？')">删除</a>
                <a th:href="@{'/loginBack/back/toEditSingle?singleId='+${item.singleId}}">修改</a>
            </td>
        </tr>
        </tbody>
    </table>
    </div>
<div class="pagination-container">
    <div class="pagination-info">
        <div th:with="path='/loginBack/back/single?pageNum='" style="margin-top: 20px;">
            <div>
                当前是第<span th:text="${singlePage.pageNum}"></span>页
                共<span th:text="${singlePage.pages}"></span>页
                共<span th:text="${singlePage.total}"></span>条记录
            </div>
            <ul class="pagelist">
                <li>
                    <a th:href="${path}+'1'">首页</a>
                </li>
                <li th:if="${singlePage.hasPreviousPage}">
                    <a th:href="${path}+${singlePage.prePage}">上一页</a>
                </li>
                <li th:if="${singlePage.hasNextPage}">
                    <a th:href="${path}+${singlePage.nextPage}">下一页</a>
                </li>
                <li th:if="${singlePage.pages > 1}">
                    <a th:href="${path}+${singlePage.pages}">尾页</a>
                </li>
            </ul>
        </div>
    </div>
</div>
</div>
<div id="bottom">底部</div>
</body>
</html>
