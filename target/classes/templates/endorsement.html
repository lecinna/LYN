<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <style type="text/css">
        .fixed-user-area {
            position: fixed;
            top: 15px;
            right: 25px;
            z-index: 9999;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .fixed-user-area a {
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
            white-space: nowrap;
            backdrop-filter: blur(12px);
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .fixed-user-area a:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.3);
        }

        /* 登录按钮 */
        .fixed-user-area .login-btn {
            color: #fff;
            border: 1px solid rgba(102, 126, 234, 0.5);
        }
        .fixed-user-area .login-btn:hover {
            background: #667eea;
            border-color: #667eea;
            color: #fff;
        }

        /* 退出按钮 */
        .fixed-user-area .logout-btn {
            color: #fff;
            border: 1px solid rgba(231, 76, 60, 0.5);
        }
        .fixed-user-area .logout-btn:hover {
            background: #e74c3c;
            border-color: #e74c3c;
            color: #fff;
        }

        /* 后台管理按钮 */
        .fixed-user-area .admin-btn {
            color: #FFD700;
            border: 1px solid rgba(255, 215, 0, 0.5);
        }
        .fixed-user-area .admin-btn:hover {
            background: #FFD700;
            border-color: #FFD700;
            color: #0a0a0a;
        }

        /* ===== 响应式（手机端适配） ===== */
        @media (max-width: 768px) {
            .fixed-user-area {
                top: 10px;
                right: 10px;
                gap: 6px;
            }
            .fixed-user-area a {
                font-size: 11px;
                padding: 4px 12px;
            }
        }

    </style>
    <meta charset="UTF-8">
    <title>代言</title>
    <link rel="stylesheet" th:href="@{/local/css/main.css}">
    <link rel="stylesheet" th:href="@{/local/css/endorsement.css}">
    <link rel="stylesheet" href="/local/css/page.css">
</head>
<body>
<div class="background-image">
    <img th:src="@{/local/image/photos/06.jpg}" alt="首页主图" width="1635px" height="800px">
    <div class="fixed-user-area">
        <li th:if="${session.userRole != null and session.userRole == 'admin'}" style="list-style:none;">
            <a th:href="@{/backFirst/first}" class="admin-btn">⚙️ 后台管理</a>
        </li>
        <li th:if="${session.userRole == null}" style="list-style:none;">
            <a th:href="@{/admin/login}" class="login-btn">🔑 登录</a>
        </li>
        <li th:if="${session.userRole != null}" style="list-style:none;">
            <a th:href="@{/admin/logout}" class="logout-btn">🚪 退出</a>
        </li>
    </div>
</div>
<div class="nav">
    <ul class="navCon">
        <h2>
            <li class="dropdown">
                <a th:href="@{/admin/index}" class="dropbtn">个人介绍</a>
                <div class="dropdown-content">
                    <a th:href="@{/admin/index}">个人介绍</a>
                    <a th:href="@{/admin/performance}">演艺经历</a>
                </div>
            </li>
            <li class="dropdown">
                <!--<a th:href="@{/admin/music}" class="dropbtn"></a>-->
                音乐作品
                <div class="dropdown-content">
                    <a th:href="@{/admin/music/ost}">OST</a>
                    <a th:href="@{/admin/music/ep}">专辑</a>
                    <a th:href="@{/admin/music/single}">单曲</a>
                </div>
            </li>
            <li><a th:href="@{/admin/action}">影视作品</a></li>
            <li><a th:href="@{/admin/word}">经典语录</a></li>
            <li class="dropdown">
                <!-- <a th:href="@{/admin/prize}" class="dropbtn"></a>-->
                代言及奖项
                <div class="dropdown-content">
                    <a th:href="@{#}">代言</a>
                    <a th:href="@{/admin/prize/achievement}">奖项</a>
                </div>
            </li>
            <li><a th:href="@{/admin/concert}">演唱会</a></li>
            <li><a th:href="@{/admin/message}">留言</a></li>
            <!-- 👇 只有管理员才显示后台管理 -->
            <!--<li th:if="${session.userRole != null and session.userRole == 'admin'}">
                <a th:href="@{/admin/doLogin}">后台管理</a>
            </li>-->
        </h2>
    </ul>
</div>
<div class="page-title">
    <h1>品牌代言</h1>
    <h3>Brand Endorsements</h3>
</div>
<div class="endorsement-container">
    <div th:each="item, iterStat : ${endorsementPage.list}" class="endorsement-card">
        <div class="shine"></div>
        <div class="endorsement-image">
            <img th:src="@{${item.image}}" th:alt="${item.name}">
            <div class="endorsement-overlay"></div>
        </div>
        <div class="endorsement-info">
            <div class="endorsement-name" th:text="${item.name}"></div>
            <div class="endorsement-date" th:text="${item.time}"></div>
        </div>
        <div class="endorsement-badge" th:text="${iterStat.count}"></div>
    </div>
</div>
<div th:with="path='/admin/prize/endorsement?pageNum='" style="text-align: center; margin-top: 20px;">
    <div>
        当前是第<span th:text="${endorsementPage.pageNum}"></span>页
        共<span th:text="${endorsementPage.pages}"></span>页
        共<span th:text="${endorsementPage.total}"></span>条记录
    </div>
    <ul class="pagelist">
        <li>
            <a th:href="${path}+'1'">首页</a>
        </li>
        <li th:if="${endorsementPage.hasPreviousPage}">
            <a th:href="${path}+${endorsementPage.prePage}">上一页</a>
        </li>
        <li th:if="${endorsementPage.hasNextPage}">
            <a th:href="${path}+${endorsementPage.nextPage}">下一页</a>
        </li>
        <li>
            <a th:href="${path}+${endorsementPage.pages}">尾页</a>
        </li>
    </ul>
</div>

</div>
</body>
</html>
