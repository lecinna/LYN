<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" >
<head>
    <style type="text/css">
        .fixed-user-area {
            position: fixed;
            top: 15px;
            right: 25px;
            z-index: 9999;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .fixed-user-area a {
            text-decoration: none;
            padding: 8px 20px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
            white-space: nowrap;
            backdrop-filter: blur(12px);
            background: rgba(0, 0, 0, 0.55);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .fixed-user-area a:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(0, 0, 0, 0.3);
        }

        /* 登录按钮 */
        .fixed-user-area .login-btn {
            color: #fff;
            border: 1px solid rgba(102, 126, 234, 0.5);
        }
        .fixed-user-area .login-btn:hover {
            background: #667eea;
            border-color: #667eea;
            color: #fff;
        }

        /* 退出按钮 */
        .fixed-user-area .logout-btn {
            color: #fff;
            border: 1px solid rgba(231, 76, 60, 0.5);
        }
        .fixed-user-area .logout-btn:hover {
            background: #e74c3c;
            border-color: #e74c3c;
            color: #fff;
        }

        /* 后台管理按钮 */
        .fixed-user-area .admin-btn {
            color: #FFD700;
            border: 1px solid rgba(255, 215, 0, 0.5);
        }
        .fixed-user-area .admin-btn:hover {
            background: #FFD700;
            border-color: #FFD700;
            color: #0a0a0a;
        }

        /* ===== 响应式（手机端适配） ===== */
        @media (max-width: 768px) {
            .fixed-user-area {
                top: 10px;
                right: 10px;
                gap: 6px;
            }
            .fixed-user-area a {
                font-size: 11px;
                padding: 4px 12px;
            }
        }

    </style>
    <meta charset="UTF-8">
    <title>演艺经历</title>
    <style type="text/css">
        body {
            background: linear-gradient(135deg, #FFD569 0%, #B0DCE6 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }
        .pagination-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 120px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(222, 184, 135, 0.15);
        }

        .pagination-info {
            color: #666;
            font-size: 14px;
            text-align: center;
        }

        .pagination-info span {
            color: #B8860B;
            font-weight: 600;
            margin: 0 3px;
        }

        .pagelist {
            display: flex;
            gap: 8px;
            list-style: none;
            margin: 15px 0 0 0;
            padding: 0;
            justify-content: center;
        }

        .pagelist li a {
            padding: 8px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            text-decoration: none;
            color: #666;
            transition: all 0.3s ease;
            display: inline-block;
        }

        .pagelist li a:hover {
            color: white;
            border-color: #667eea;
        }
    </style>
    <link rel="stylesheet" th:href="@{/local/css/main.css}">
    <link rel="stylesheet" th:href="@{/local/css/performance.css}">
    <link rel="stylesheet" th:href="@{/local/css/page.css}">

</head>
<body>
<div class="background-image">
    <img th:src="@{/local/image/photos/06.jpg}" alt="首页主图" width="1635px" height="800px">
</div>
<div class="nav">
    <ul class="navCon">
        <h2>
            <li class="dropdown">
                <a th:href="@{/admin/index}" class="dropbtn">个人介绍</a>
                <div class="dropdown-content">
                    <a th:href="@{/admin/index}">个人介绍</a>
                    <a th:href="@{#}">演艺经历</a>
                </div>
            </li>
            <li class="dropdown">
                <!--<a th:href="@{/admin/music}" class="dropbtn"></a>-->
                音乐作品
                <div class="dropdown-content">
                    <a th:href="@{/admin/music/ost}">OST</a>
                    <a th:href="@{/admin/music/ep}">专辑</a>
                    <a th:href="@{/admin/music/single}">单曲</a>
                </div>
            </li>
            <li><a th:href="@{/admin/action}">影视作品</a></li>
            <li><a th:href="@{/admin/word}">经典语录</a></li>
            <li class="dropdown">
                <!-- <a th:href="@{/admin/prize}" class="dropbtn"></a>-->
                代言及奖项
                <div class="dropdown-content">
                    <a th:href="@{/admin/prize/endorsement}">代言</a>
                    <a th:href="@{/admin/prize/achievement}">奖项</a>
                </div>
            </li>
            <li><a th:href="@{/admin/concert}">演唱会</a></li>
            <li><a th:href="@{/admin/message}">留言</a></li>

            <!--👇 只有管理员才显示后台管理
            <li th:if="${session.userRole != null and session.userRole == 'admin'}">
                <a th:href="@{/admin/doLogin}">后台管理</a>
            </li>-->
        </h2>
    </ul>
</div>
<h1  style="text-align: center; color: #333; margin-top: 50px;">发展历程</h1>
<h3 style="text-align: center; color: #666; margin-bottom: 30px;">CONMPANY HISTORY</h3>
<div class="timeline-container">
    <div th:each="item : ${performancePage.list}" class="timeline-item">
        <div class="timeline-content">
            <span class="timeline-year" th:text="${item.date}"></span>
            <div class="timeline-description">
                <p th:text="${item.active}"></p>
            </div>
            <div th:text="${item.work}" class="work-tags">
                <span class="work-tag" th:text="${item.work}"></span>
            </div>
        </div>
    </div>
    <div class="pagination-container">
        <div class="pagination-info">
            <div th:with="path='/admin/performance?pageNum='" style="margin-top: 20px;">
                <div>
                    当前是第<span th:text="${performancePage.pageNum}"></span>页
                    共<span th:text="${performancePage.pages}"></span>页
                    共<span th:text="${performancePage.total}"></span>条记录
                </div>
                <ul class="pagelist">
                    <li>
                        <a th:href="${path}+'1'">首页</a>
                    </li>
                    <li th:if="${performancePage.hasPreviousPage}">
                        <a th:href="${path}+${performancePage.prePage}">上一页</a>
                    </li>
                    <li th:if="${performancePage.hasNextPage}">
                        <a th:href="${path}+${performancePage.nextPage}">下一页</a>
                    </li>
                    <li th:if="${performancePage.pages > 1}">
                        <a th:href="${path}+${performancePage.pages}">尾页</a>
                    </li>
                </ul>
            </div>
        </div>
        <div>
</div>
</div>
</div>

</body>
</html>
