<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>用户注册</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      font-family: "Microsoft YaHei", sans-serif;
    }
    .register-container {
      background: white;
      padding: 40px 35px;
      border-radius: 16px;
      box-shadow: 0 15px 50px rgba(0,0,0,0.2);
      width: 400px;
    }
    .register-container h2 {
      text-align: center;
      color: #333;
      font-size: 24px;
      margin-bottom: 8px;
    }
    .register-container .subtitle {
      text-align: center;
      color: #999;
      font-size: 14px;
      margin-bottom: 25px;
    }
    .register-container .back-link {
      display: block;
      text-align: center;
      color: #667eea;
      text-decoration: none;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .register-container .back-link:hover {
      text-decoration: underline;
    }
    .register-container label {
      display: block;
      font-size: 14px;
      color: #555;
      margin-bottom: 5px;
      font-weight: 500;
    }
    .register-container input,
    .register-container select {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 16px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s ease;
      box-sizing: border-box;
    }
    .register-container input:focus,
    .register-container select:focus {
      outline: none;
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
    }
    .register-container .error {
      color: #e74c3c;
      font-size: 13px;
      text-align: center;
      margin-bottom: 12px;
    }
    .register-container .success {
      color: #27ae60;
      font-size: 13px;
      text-align: center;
      margin-bottom: 12px;
    }
    .register-container .btn-register {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .register-container .btn-register:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
    }
    .register-container .login-link {
      text-align: center;
      margin-top: 16px;
      font-size: 14px;
      color: #999;
    }
    .register-container .login-link a {
      color: #667eea;
      text-decoration: none;
    }
    .register-container .login-link a:hover {
      text-decoration: underline;
    }
    .role-tip {
      font-size: 12px;
      color: #999;
      text-align: center;
      margin-top: -8px;
      margin-bottom: 12px;
    }
  </style>
</head>
<body>
<div class="register-container">
  <a th:href="@{/admin/login}" class="back-link">← 返回登录</a>
  <h2>用户注册</h2>
  <p class="subtitle">创建新账号</p>

  <!-- 错误信息 -->
  <div class="error" th:if="${error != null}" th:text="${error}"></div>
  <!-- 成功信息 -->
  <div class="success" th:if="${msg != null}" th:text="${msg}"></div>

  <form th:action="@{/admin/register}" method="post">
    <label>用户名</label>
    <input type="text" name="username" placeholder="请输入用户名" required>

    <label>密码</label>
    <input type="password" name="password" placeholder="请输入密码（至少6位）" required>

    <label>确认密码</label>
    <input type="password" name="confirmPassword" placeholder="请再次输入密码" required>

    <label>注册角色</label>
    <select name="role">
      <option value="user">👤 普通用户</option>
      <option value="admin">👑 管理员</option>
    </select>
    <p class="role-tip">管理员可访问后台管理，普通用户仅可浏览</p>

    <button type="submit" class="btn-register">注 册</button>
  </form>

  <div class="login-link">
    已有账号？ <a th:href="@{/admin/login}">立即登录</a>
  </div>
</div>
</body>
</html>
